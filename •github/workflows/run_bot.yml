name: Chao Buoi Sang

on:
  schedule:
    - cron: '0 1 * * *' # 8h00 sáng giờ VN
  workflow_dispatch: # Nút bấm chạy thử bằng tay

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Cai thu vien
        run: pip install requests
      - name: Chay Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python Bot.py
